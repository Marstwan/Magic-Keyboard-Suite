name: Build & Release Magic Keyboard Suite (macOS + Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-shared:
    name: Verificar recursos compartidos y tests unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Comprobar que los recursos generados están al día
        run: python3 shared/tools/generate.py --check
      - name: Ejecutar tests de generación y validación XAML
        run: python3 -m unittest discover -s tests -v
      - name: Ejecutar tests unitarios .NET y compilación del Agente
        run: |
          dotnet test tests/MagicKeyboardSuite.Tests/MagicKeyboardSuite.Tests.csproj -c Release --nologo
          dotnet build windows/Agent/MagicKeyboardAgent.csproj -c Release --nologo -warnaserror

  build-macos:
    name: Compilar macOS (SwiftUI .app + .dmg)
    needs: verify-shared
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar y crear DMG
        run: ./macos/build.sh --dmg
      - uses: actions/upload-artifact@v4
        with:
          name: MagicKeyboardSuite-macOS-dmg
          path: macos/MagicKeyboardSuite-macOS.dmg

  build-windows:
    name: Compilar Windows 11 (WinUI 3 + Agente + Instalador .msi)
    needs: verify-shared
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar y generar MSI (WiX Toolset v5)
        shell: pwsh
        run: ./windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MagicKeyboardSuite-Windows-msi
          path: windows/MagicKeyboardSuite-Setup.msi

  release:
    name: Publicar GitHub Release
    needs: [ build-macos, build-windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generar SHA256SUMS.txt
        working-directory: dist
        run: sha256sum MagicKeyboardSuite-macOS.dmg MagicKeyboardSuite-Setup.msi > SHA256SUMS.txt
      - name: Crear Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/MagicKeyboardSuite-macOS.dmg
            dist/MagicKeyboardSuite-Setup.msi
            dist/SHA256SUMS.txt
