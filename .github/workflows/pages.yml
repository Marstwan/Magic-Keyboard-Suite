name: Deploy GitHub Pages Website

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - 'shared/assets/icon-1024.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar web en GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar icono maestro desde shared/assets
        run: |
          mkdir -p docs/assets
          cp shared/assets/icon-1024.png docs/assets/icon.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: 'docs'
      - id: deployment
        uses: actions/deploy-pages@v4
